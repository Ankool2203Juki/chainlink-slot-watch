name: Chainlink Slot Watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message instead of checking the pool"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chainlink-slot-watch
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test Telegram
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e 'fetch("https://api.telegram.org/bot"+process.env.TELEGRAM_BOT_TOKEN+"/sendMessage",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat_id:process.env.TELEGRAM_CHAT_ID,text:"✅ Chainlink Slot Watch test OK!\nGitHub Actions → Telegram is working.\n\nThe real monitor will alert only when Community Pool capacity is verifiably available."})}).then(async r=>{if(!r.ok)throw new Error(await r.text());console.log("Telegram test sent.")})'

      - name: Check Chainlink Community Pool
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_telegram) }}
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node monitor.mjs
